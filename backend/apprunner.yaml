# AWS App Runner — source-based deploy (no container registry needed).
# In App Runner: Create service → Source: this repo → Source directory: backend
# → Use a configuration file. App Runner reads this file.
version: 1.0
runtime: nodejs18
build:
  commands:
    build:
      - npm ci
      - npm run build
run:
  command: node dist/index.js
  network:
    port: 4000
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "4000"
    # Set these as App Runner runtime env vars (or secrets) in the console:
    #   API_KEY, ADMIN_PASSCODE, CORS_ORIGIN, DATABASE_URL (RDS Postgres)
