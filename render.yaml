# Render Blueprint — one-click deploy of the DatalakeFaceAuth sync backend.
# In the Render dashboard: New → Blueprint → point at this repo.
# The backend runs with an in-memory store unless you add a DATABASE_URL
# (uncomment the database block + the fromDatabase env var for persistence).
services:
  - type: web
    name: datalake-face-sync
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: API_KEY
        generateValue: true # shared secret; mirror into the frontend's VITE_SYNC_KEY
      - key: ADMIN_PASSCODE
        generateValue: true # /admin?key=... (server-rendered ops console)
      # REQUIRED — the service refuses to start without these. Render prompts
      # for `sync: false` vars at blueprint deploy time; fill them in there, or
      # the instance will exit with a message naming what is missing.
      - key: ADMIN_USER
        sync: false # admin dashboard login username
      - key: ADMIN_PASSWORD
        sync: false # admin dashboard login password
      - key: CORS_ORIGIN
        sync: false # set to https://<your-vercel-app>.vercel.app
      # Supabase as the durable store (service_role key — server-side only).
      # When both are set, sites (+ future enrolment) persist to Supabase.
      - key: SUPABASE_URL
        sync: false # https://<project>.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false # sb_secret_... (NEVER expose client-side)
      # For durable storage, create a Render Postgres and wire it here:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: datalake-face-db
      #     property: connectionString

